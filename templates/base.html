{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Portafolio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <nav>
        <a href="{% url 'core:inicio' %}">Inicio</a>
        <a href="{% url 'proyectos:lista' %}">Proyectos</a>
        <a href="{% url 'blog:lista' %}">Blog</a>
        <a href="{% url 'contacto:formulario' %}">Contacto</a>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
    <div class="footer-content">
        <div class="footer-social">
            <a href="{{ linkedin_url }}" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn">
                <span class="social-icon">in</span>
                <span class="social-label">LinkedIn</span>
            </a>
            <a href="{{ github_url }}" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
                <span class="social-icon">{ }</span>
                <span class="social-label">GitHub</span>
            </a>
            <a href="mailto:{{ email_contacto }}" class="social-link" aria-label="Email">
                <span class="social-icon">@</span>
                <span class="social-label">{{ email_contacto }}</span>
            </a>
        </div>
        <p class="footer-copy">// &copy; 2026 {{ nombre_completo }} — Hecho con Django</p>
    </div>
</footer>
</body>
</html>
